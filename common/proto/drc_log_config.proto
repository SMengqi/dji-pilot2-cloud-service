syntax = "proto2";

package drc_log;

message PretLogLevel
{
	optional uint32 ulPretOam = 1;
	optional uint32 ulPretMc = 2;
	optional uint32 ulPretNets = 3;
	optional uint32 ulDrcPretX = 4;
	optional uint32 ulDrcTimer = 5;
	optional uint32 ulDrcPlatformEX = 6;	
	optional uint32 ulDrcNetWork = 7;
	optional uint32 ulDrcComm = 8;
};

message RctpLogLevel
{
	optional uint32 ulRctpMc = 1;
	optional uint32 ulRctpRecm = 2;
	optional uint32 ulRctpRegc = 3;
	optional uint32 ulRctpRdpm = 4;
	optional uint32 ulDrcRctpX = 5;
	optional uint32 ulDrcTimer = 6;
	optional uint32 ulDrcPlatformEX = 7;	
	optional uint32 ulDrcNetWork = 8;
	optional uint32 ulDrcComm = 9;
};

message RcerLogLevel
{
	optional uint32 ulRcerMc = 1;
	optional uint32 ulRcerOam = 2;
	optional uint32 ulDrcRcer = 3;
	optional uint32 ulDrcTimer = 4;
	optional uint32 ulDrcPlatformEX = 5;	
	optional uint32 ulDrcNetWork = 6;
	optional uint32 ulDrcComm = 7;
};


message VtsmLogLevel
{
	optional uint32 ulVtsmMc = 1;
	optional uint32 ulVtsmRecm = 2;
	optional uint32 ulVtsmRegc = 3;
	optional uint32 ulDrcVtsm = 4;
	optional uint32 ulDrcTimer = 5;
	optional uint32 ulDrcPlatformEX = 6;	
