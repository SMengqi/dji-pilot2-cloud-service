	optional uint32 ulDrcEhmsJam = 4;
	optional uint32 ulDrcEhmsPed = 5;
	optional uint32 ulDrcEhmsApk = 6;
	optional uint32 ulDrcTimer = 7;
	optional uint32 ulDrcPlatformEX = 8;	
	optional uint32 ulDrcNetWork = 9;
	optional uint32 ulDrcComm = 10;
	optional uint32 ulDrcEhmsNclc = 11;
	optional uint32 ulDrcEhmsTj = 12;
	optional uint32 ulDrcEhmsTci = 13;
    optional uint32 ulDrcCommon = 14;
