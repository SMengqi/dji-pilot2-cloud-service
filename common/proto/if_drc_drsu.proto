message DRSU_DRC_DATA_INFO_IND_MSG
{
    optional uint32 ulFrameTimer = 1; 
    optional uint32 ulSubFrameTimer = 2; 
    optional if_proto_common.Header stHeader = 3;
    repeated if_proto_common.trafficLight astTrafficLight = 4;
    repeated if_proto_common.Obstacle astObstacle = 5;
    repeated if_proto_common.RoadSurface stRoadSurface = 6;
    optional uint64 ulFrameCount = 7;
//    repeated if_proto_common.Events events = 8; 
    optional uint32 subNodeID = 9; //数据来源的子节点(点位)号; its800使用
    optional uint64 llCreateTime = 10;  //drc接收kfk时间戳，只有drc在用
}


message DRC_DRSU_LOGUPLOAD_CFG_REQ_MSG
