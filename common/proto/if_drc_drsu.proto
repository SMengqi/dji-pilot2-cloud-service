syntax = "proto2";
package if_drc_drsu;

import "bxt.obstacle_v2.proto";
import "bxt.common.Header.proto";
import "if_proto_common.proto";
import "bxt.common.math.Vector3d.proto";
//import "bxt.events.proto";



message DRSU_DRC_REG_REQ
{
    repeated uint32 aucDrsuMacAddr = 1;
    optional string aucMapVersionNo = 2;
    optional string aucSoftwareVersionNo = 3;
    optional string aucProtocolVersion = 4;
    optional if_proto_common.PointUTM stCoordinate = 5;
    optional if_proto_common.DRSU_REG_TYPE_E ulRegType = 6;
    optional if_proto_common.DRSU_SCHEME_TYPE ulDrsuSchemeType = 7 [default = SCHEME_FABU];
}

message DRC_DRSU_REG_RSP
{
    optional uint32 ulResult = 1; 
    optional uint32 ulDelayRegTimer = 2; //minute	
}

enum DRSU_LOG_REPORT_FLAG_E
{
    DRSU_LOG_REPORT_OFF  = 0;      
    DRSU_LOG_REPORT_ON  = 1;   
}

message DRSU_LOG_REPORT_STRU
{
    optional if_proto_common.DEV_FUNC_SWITCH_E ulLogOnOffFlag = 1;
    optional uint32 ulLogPeriodOfReport = 2;
    optional string aucStartUpdateDate = 3;
    optional string aucStartUpdateTime = 4;
    optional uint32 ulDevUploadOffset = 5;
    optional if_proto_common.LogFtpInfo stLogFtpInfo = 6;
}

message DRSU_TMPRT_THRESHLOD
{
    optional uint32 ulDrsuUpTemp = 1;
    optional uint32 ulDrsuDownTemp = 2;	
}
message DRC_DRSU_CFG_REQ
{
    optional uint32 ulMapUptFlag = 1;
    optional uint32 ulPeriodOfDataRpt = 2;
    optional if_proto_common.DRSU_ALARM_REPORT_PERIOD_E ulPeriodOfAlarmRpt = 3;
    optional if_proto_common.DRSU_NET_TIME_STRU stCycleStartTime = 4; // HH-mm
    optional if_proto_common.DRSU_NET_TIME_STRU stCycleEndTime = 5;
    optional DRSU_TMPRT_THRESHLOD stDrsuTmprtThreshlod = 6; 
    optional uint32 ulOpenBoxAlarmDisableTime = 7; //0-480
    optional DRSU_LOG_REPORT_STRU stLogReportCfg = 8;
    optional if_proto_common.DRSU_AI_CFG_STRU stAiCfg = 9;
}

message DRSU_DRC_CFG_RSP
{
    optional uint32 ulResult = 1;
    repeated if_proto_common.DEVICE_INFO_STRU astDeviceList =2;
}

message DRC_DRSU_DATA_SYNC_REQ
{
    optional double dbDataTriggerTime = 1;
}

message DRSU_DRC_DATA_SYNC_RSP
{
    optional uint32 ulResult = 1;
}

message DRC_DRSU_SOFTWARE_UPDATE_REQ
{
    optional uint32 ulTransId = 1;  
    optional if_proto_common.DRSU_FORCCE_UPDATE_TYPE_E ulForceUptFlag = 2;   
    optional if_proto_common.SwFtpInfo stFtpAddress = 3;
