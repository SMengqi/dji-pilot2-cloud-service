message GimbalData {
  required int32 MissionType = 1;       //任务类型
  required string MissionId = 2;        //作业ID
  optional int32 Angle = 3;               //角度转向，单位：度
  optional int32 Time = 4;                //转向时间，单位：秒钟
  optional int32 Zoom = 5;              //缩放倍数
  optional string PhotoMode = 6;        //拍照模式，单拍Single,连拍Multiple
  optional int32 ExposureMode = 7;      //曝光模式
  optional int32 ISO = 8;               //ISO
  optional int32 EV = 9;                //曝光值
  optional int32 Shutter = 10;          //快门
  optional int32 ContinuousNumber = 11; //连拍张数
  // optional int32 Zoom = 12;             //缩放倍数
  optional int32 Aperture = 13;         //光圈值
  optional int32 Mode = 14;             //0代表照相模式，1代表摄像模式
  optional int32 DisplayMode = 15;      //显示模式
  optional string Text = 16;            //喊话器播放文字
  optional int32 Volume = 17;           //音量大小数值 0-10范围
  optional string Bytes = 18;           //喊话器播放的MP3文件转为byte数组后通过ISO_8859_1编码方式转为字符串，使用时请先将字符串通过ISO_8859_1编码防暑转为byte数组
  optional int32 PlayType = 19;         //播放类型，0位录音，1位即时语音 
}




message ParamListData {
  optional string ParamId = 1;          //动作参数编码
  optional string Value = 2;            //参数值
}



message ActionListData {
  optional int32 ActionNum = 1;          //航点动作顺序号，定点数，动作从1开始计数，第一个航点的第一个动作为101，第二个动作为102，若没动作传0或者不传
  optional string ActionId = 2;          //动作编码
  optional ParamListData ParamList = 3;  //参数值列表
}


message PointData {
  optional int32 Height = 1;            	//高度        
  optional int32 Latitude = 2;                  //纬度
  optional int32 Longitude = 3;                 //经度    
  optional int32 Speed = 4;                     //单个航点速度
  optional ActionListData ActionList = 5;       //动作列表
}


message SubLineData {
  optional int32 StartWpNumber = 1;            	//起始航点序号       
  optional int32 StartHeight = 2;               //起始点高度
  optional int32 StartLatitude = 3;             //起始点纬度   
  optional int32 StartLongitude = 4;            //起始点经度
  optional int32 EndWpNumber = 5;               //终止航点序号 


  optional int32 EndLatitude = 6;               //终止航点纬度
  optional int32 EndLongitude = 7;              //终止航点经度
  optional int32 EndHeight = 8;                 //终止点高度   
  optional int32 Speed = 9;                     //航点速度
  optional ActionListData ActionList = 10;      //航点动作列表，航点动作数据

}




message WaypointData {
  required int32 MissionType = 1;       //任务类型
  required string MissionId = 2;        //作业ID
  optional int32 WaypointVer = 3;       //航线版本
  optional int32 ConnLostPlan = 4;      //断网措施,定点数 1: 返航，2:悬停，3：完成剩余航线 
  optional int32 FinishPlan = 5;        //飞行结束后措施
  optional int32 ReturnHeight = 6;      //返航高度
  optional int32 ReturnSpeed = 7;       //返航速度
  optional int32 GS = 8;                //速度 
  optional int32 ResetCamera = 9;       //在每段航线开始复位摄像头，定点数 1:开启，2:关闭
  optional int32 LineId = 10;           //航线id
  
  optional PointData Points = 11;        //点集
  optional SubLineData SubLine = 12;     //航线段

}




