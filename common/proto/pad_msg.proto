syntax = "proto2";
package if_proto_common;

import "bxt.common.Header.proto";
import "chassis.proto";

enum DrivingAction {
  STOP = 0;
  START = 1;
  RESET = 2;
};

message PadMessage {
  // control mode, set mode according to low level defination
  optional if_proto_common.Header header = 1;

  // send driving mode to drive
  optional if_proto_common.Chassis.DrivingMode driving_mode = 2;

  // action in the driving_mode
  optional DrivingAction action = 3;
}
