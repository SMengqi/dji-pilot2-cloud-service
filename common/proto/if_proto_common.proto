syntax = "proto2";
package if_proto_common;

enum DRSU_REG_TYPE_E 
{
    DRSU_REG_SELF_START = 1;
    DRSU_REG_RESTART = 2;
    DRSU_REG_SOFTWARE_UPGRADE = 3;
}

enum DRSU_DEVICE_TYPE_E
{
    DEVICE_NULL = 0;
    DEVICE_LIDAR = 1;
    DEVICE_CAMERA = 2;
    DEVICE_TRAFFIC_LIGHT = 3;
    DEVICE_GPS = 4;
    DEVICE_BUZZER = 5;
    DEVICE_RADIATOR_FAN = 6;
    DEVICE_IP_CAMERA = 7;
    DEVICE_RADAR = 8;
}

message DEVICE_INFO_STRU 
{
    optional uint32 ulDeviceId = 1;
    optional DRSU_DEVICE_TYPE_E ulDeviceType = 2;
    optional string  aucDeviceModel = 3;
    optional string  aucDeviceVersion = 4;
    optional DRSU_DEV_WORKING_STATE_E ulWorkingStatus = 5; // DRSU_DEV_WORKING_STATE_E
}

enum DRSU_FORCCE_UPDATE_TYPE_E
{
    DRSU_UNFORCCE_UPDATE = 0;
    DRSU_FORCCE_UPDATE = 1;
} 

enum DRSU_DEV_WORKING_STATE_E
{
    DRSU_DEV_WORKING_POWEROFF = 1;  // poweroff 
    DRSU_DEV_WORKING_NORMAL = 2;    // poweron and working normal 
    DRSU_DEV_WORKING_FRAME_RATE_ABNORMAL = 3;   // poweron but frame rate abnormal  
    DRSU_DEV_WORKING_INTERRUPT = 4; // poweron but data interrupt  
    DRSU_DEV_WORKING_NODATA = 5;    // poweron but no data 
}
message DEVICE_STATUS_STRU
{
    optional uint32 ulDeviceId = 1;
    optional DRSU_DEV_WORKING_STATE_E ulWorkingStatus = 2; 
}
enum DRSU_ALARM_REPORT_PERIOD_E
{
    ALARM_REPORT_PERIOD_60S = 60;   //60s
    ALARM_REPORT_PERIOD_120S = 120;
    ALARM_REPORT_PERIOD_180S = 180;
}


