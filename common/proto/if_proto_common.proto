message SystemStatus {
  enum Module {
    EPS = 0;
    IBS = 1;
    VCU = 2;
    EPB = 3;
    LOCALIZATION = 4;
    HDMAP = 5;
    CAMERA = 6;
    LIDAR = 7;
    RADAR = 8;
    CONTROL = 9;
  }

  message Status {
    // module name.
    optional Module module = 1;

    // is normal
    optional bool normal = 2;
  }

  optional uint32 ul_global_id = 1;

  repeated Status status = 2;
}

enum DRSU_SCHEME_TYPE
{
    SCHEME_FABU = 0;
    SCHEME_HUAWI_ITS = 1;
};