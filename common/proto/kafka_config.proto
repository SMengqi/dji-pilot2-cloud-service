syntax = "proto2";
package kafka_config;


enum kafka_data_type {
  DRSU_DATA_IND = 0;
  EVENT_IND = 1;
  TCI_IND = 2;
  FUSED_TRAFFIC_DATA_IND = 3;
  TRAFFICLIGHT_DATA_IND = 4;  
  TRAFFIC_INFO_IND = 5;    
  KEY_VEHICLE_MAP_IND = 6; 
  DEBUG_ABNORMAL_PARKING = 7;
  DEBUG_TRAFFIC_ACCIDENT = 8;
  DEBUG_VIOLATION_PERSON = 9;
  DEBUG_JAM = 10;
  DEBUG_ROAD_MAINTENANCE = 11;
  DEBUG_ULTRA_LOW_SPEED = 12;
  DEBUG_LOW_SPEED = 13;
  DEBUG_EXCEED_SPEED = 14;
  DEBUG_CONVERSE_RUNNING = 15;  
  DEBUG_DETECTOR_INFO = 16; 
  VT_POSITION_IND = 17;
  DRSU_TRAFFICLIGHT_DATA_IND = 18;
  SIGNAL_CTRL_PERIOD_ANALYSE = 19;
  DEBUG_FILTER_STATISTICS_IND = 30;
  DEBUG_ETOD_CHECK = 31;
  TBOX_TRANSMIT_IND = 35;
  UAV_FLIGHT_DATA_REQ = 50003;
  UAV_STARTUP_REQ = 50001;
  UAV_HEARTBEAT_REQ = 50002;
  UAV_STARTUP_RSP = 60001;
  UAV_COMMAND_CTRL = 60003;
  UAV_RADAR_DATA_REQ = 80003;
};


message kafka_init_data
{
    optional string config_key = 1;
    optional string config_value = 2;
}

message kafka_init_security
{
    optional string security_protocol = 1;
    optional string sasl_mechanism = 2;
    optional string user_name = 3;
    optional string user_passwd = 4;
}


message kafka_producer_init_list
{
    optional string brokers = 1;
    optional string topics = 2; 
    optional bool idempotent = 3;
    optional kafka_init_security sec_config = 4;
    repeated kafka_init_data kafka_init_list = 5;
    optional string send_api_key = 6;
    optional kafka_data_type data_type = 7;
    optional string custom_key = 8;
}

message kafka_consumer_init_list
{
    optional string brokers = 1;
    optional string topics = 2; 
    optional string groupid = 3;
    optional kafka_init_security sec_config = 4;
    repeated kafka_init_data kafka_init_list = 5;
    optional kafka_data_type data_type = 6;
}

message kafka_user_list
{
    repeated kafka_producer_init_list producer_list = 1;
    repeated kafka_consumer_init_list consumer_list = 2;
}


